# ─────────────────────────────────────────────
# 뷰티판다 카드뉴스 자동화 설정 (추가 비용 0원 버전)
# ─────────────────────────────────────────────

account:
  handle: "@_beauty.panda"
  # 피드의 목표. Claude가 원고를 쓸 때 이 기준을 따릅니다.
  goal: "뷰티샵 원장님을 모으는 것. 원장님이 저장하고, 옆 샵 원장님께 공유하고, 팔로우하고 싶은 실무 정보를 준다. 서비스 홍보나 링크 유도는 하지 않는다."

# 평일 글 카테고리 순서 (돌아가면서). info=오늘의 정보, mkt=오늘의 마케팅
rotation: [info, mkt]

slides:
  count: 7            # 표지와 결론 포함 장수 (5~9)
  gather_slide: false  # 마지막에 저장·공유·팔로우 장 추가 (공지 글 제외)
  max_photos: 3       # 글 하나에 들어가는 사진 수 (표지 포함)
