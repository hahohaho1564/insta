name: 인스타그램 게시

on:
  issues:
    types: [labeled]
  schedule:
    - cron: "0 3 * * 1-5"   # 평일 정오(한국시간). config.yaml의 publish_time과 맞춰주세요
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  approve:
    if: github.event_name == 'issues' && github.event.label.name == '승인' && contains(github.event.issue.labels.*.name, '카드뉴스')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 승인 처리 (예정일이면 바로 게시)
        run: python -m src.pipeline approve
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}

  publish:
    if: github.event_name != 'issues'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 오늘 올릴 글 게시
        run: python -m src.pipeline publish
        env:
          GH_TOKEN: ${{ github.token }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
